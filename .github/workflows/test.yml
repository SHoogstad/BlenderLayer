name: Test

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: '5'
            python: '3.10'
          - qt: '6'
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install PyQt${{ matrix.qt }}
        run: pip install PyQt${{ matrix.qt }}
      - name: Smoke test
        env:
          BLENDER_LAYER_QT: ${{ matrix.qt }}
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_test.py
      - name: Build package
        run: python scripts/package.py
